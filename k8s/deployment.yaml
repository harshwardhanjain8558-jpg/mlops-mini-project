apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp289-api
  labels:
    app: mp289-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mp289-api        # must match the Pod labels below
  template:
    metadata:
      labels:
        app: mp289-api
    spec:
      containers:
        - name: mp289-api
          image: mp289-api:1.0
          imagePullPolicy: IfNotPresent   # use the locally built image
          ports:
            - containerPort: 8000
          # readiness: only send traffic once the app answers /health
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          # liveness: restart a stuck container; waits longer so a slow
          # start is never killed before it is ready
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
